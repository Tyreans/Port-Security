<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <title>Defensa en profundidad y la brecha de acceso interno en Capa 2</title>
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#006b8f"/>
    </marker>
    <marker id="arr-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d63b25"/>
    </marker>
    <marker id="arr-forest" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#33553c"/>
    </marker>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#312d2a"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#fbf9f8"/>
  <rect x="48" y="36" width="40" height="4" fill="#f0cc71"/>
  <text x="48" y="72" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="26" font-weight="800" fill="#161513">MODELO DE DEFENSA EN PROFUNDIDAD</text>
  <text x="48" y="100" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="500" fill="#47423e">Un intruso con acceso físico al edificio evade el firewall perimetral si la Capa 2 está abierta</text>

  <!-- Perimeter layers on left -->
  <rect x="72" y="150" width="460" height="440" rx="8" fill="#f1efed" stroke="#d4cfca" stroke-width="2"/>
  <text x="302" y="186" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="800" fill="#161513">PERÍMETRO LÓGICO (CAPAS 3 A 7)</text>

  <rect x="112" y="210" width="380" height="72" rx="6" fill="#ffffff" stroke="#e4e1dd"/>
  <text x="302" y="242" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#161513">Capas 4–7 · Firewall Perimetral / TLS / HTTPS</text>
  <text x="302" y="266" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#47423e">Filtra tráfico proveniente de Internet (WAN)</text>

  <rect x="112" y="302" width="380" height="72" rx="6" fill="#ffffff" stroke="#e4e1dd"/>
  <text x="302" y="334" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#161513">Capa 3 · Enrutamiento y ACLs</text>
  <text x="302" y="358" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#47423e">Filtra tráfico que cruza entre distintas subredes/VLANs</text>

  <rect x="112" y="405" width="380" height="155" rx="6" fill="#d6e5e5" stroke="#006b8f" stroke-width="2"/>
  <text x="302" y="438" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="800" fill="#161513">Capa 2 · Conmutación LAN (Port Security)</text>
  <text x="302" y="466" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#161513">Primera barrera física en cada puerto RJ-45 del switch.</text>
  <text x="302" y="492" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#33553c">Contiene al atacante antes de que ingrese a la VLAN.</text>
  <text x="302" y="532" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#006b8f">Capa 1/2: Tomas de pared + Interfaces del Switch</text>

  <!-- Right side: Internal bypass diagram -->
  <rect x="580" y="150" width="548" height="440" rx="8" fill="#ffffff" stroke="#e4e1dd" stroke-width="2"/>
  <text x="854" y="186" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="800" fill="#d63b25">BRECHA INTERNA SIN PORT SECURITY</text>

  <!-- Firewall ignored -->
  <rect x="620" y="215" width="210" height="68" rx="6" fill="#f5f4f2" stroke="#d4cfca"/>
  <text x="725" y="246" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#47423e">Firewall Perimetral</text>
  <text x="725" y="268" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#aea8a2">No ve tráfico intra-VLAN</text>

  <!-- Attacker inside building -->
  <rect x="870" y="215" width="220" height="68" rx="6" fill="#d63b25"/>
  <text x="980" y="245" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Intruso en Sala de Juntas</text>
  <text x="980" y="268" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#ffffff">Conecta a toma RJ-45 activa</text>

  <line x1="980" y1="283" x2="900" y2="355" stroke="#d63b25" stroke-width="3" marker-end="url(#arr-danger)"/>
  <text x="995" y="328" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#d63b25">Evade Capa 3–7</text>

  <!-- Switch in middle -->
  <rect x="660" y="360" width="380" height="64" rx="6" fill="#312d2a"/>
  <text x="850" y="398" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Switch de Acceso (Misma VLAN Local)</text>

  <line x1="850" y1="424" x2="850" y2="482" stroke="#d63b25" stroke-width="3" marker-end="url(#arr-danger)"/>

  <!-- Internal servers / victims -->
  <rect x="640" y="490" width="420" height="72" rx="6" fill="#f1efed" stroke="#d63b25" stroke-width="2"/>
  <text x="850" y="522" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#161513">Servidores Internos y Estaciones de Trabajo</text>
  <text x="850" y="546" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#d63b25">Expuestos a Sniffing, Rogue DHCP y ARP Spoofing</text>

  <text x="1152" y="652" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#aea8a2">m1-defensa-profundidad.svg</text>
</svg>
