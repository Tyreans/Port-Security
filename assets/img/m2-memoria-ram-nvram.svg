<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <title>Dónde se almacenan las MAC seguras: RAM con running-config y tabla CAM segura frente a NVRAM con startup-config</title>
  <defs>
    <marker id="aTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#006b8f"/></marker>
    <marker id="aGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#47423e"/></marker>
  </defs>
  <rect width="1200" height="675" fill="#fbf9f8"/>
  <text x="48" y="64" font-size="32" font-weight="800" fill="#161513">Memoria del switch: RAM frente a NVRAM</text>

  <!-- Chip RAM -->
  <g fill="#aea8a2">
    <rect x="84" y="104" width="14" height="14"/><rect x="134" y="104" width="14" height="14"/><rect x="184" y="104" width="14" height="14"/><rect x="234" y="104" width="14" height="14"/><rect x="284" y="104" width="14" height="14"/><rect x="334" y="104" width="14" height="14"/><rect x="384" y="104" width="14" height="14"/><rect x="434" y="104" width="14" height="14"/>
    <rect x="84" y="518" width="14" height="14"/><rect x="134" y="518" width="14" height="14"/><rect x="184" y="518" width="14" height="14"/><rect x="234" y="518" width="14" height="14"/><rect x="284" y="518" width="14" height="14"/><rect x="334" y="518" width="14" height="14"/><rect x="384" y="518" width="14" height="14"/><rect x="434" y="518" width="14" height="14"/>
  </g>
  <rect x="48" y="118" width="452" height="400" rx="8" fill="#f1efed" stroke="#312d2a" stroke-width="3"/>
  <text x="72" y="160" font-size="28" font-weight="800" fill="#161513">RAM</text>
  <text x="146" y="160" font-size="20" font-weight="500" fill="#47423e">(volátil)</text>

  <rect x="72" y="180" width="404" height="128" rx="8" fill="#ffffff" stroke="#d4cfca" stroke-width="2"/>
  <text x="92" y="212" font-size="20" font-family="'JetBrains Mono', Consolas, monospace" fill="#161513">running-config</text>
  <rect x="92" y="236" width="112" height="44" rx="8" fill="#f5f4f2" stroke="#33553c" stroke-width="2"/>
  <text x="148" y="265" font-size="20" font-weight="600" fill="#33553c" text-anchor="middle">Static</text>
  <rect x="220" y="236" width="112" height="44" rx="8" fill="#f5f4f2" stroke="#33553c" stroke-width="2"/>
  <text x="276" y="265" font-size="20" font-weight="600" fill="#33553c" text-anchor="middle">Sticky</text>

  <rect x="72" y="326" width="404" height="172" rx="8" fill="#ffffff" stroke="#d4cfca" stroke-width="2"/>
  <text x="92" y="358" font-size="20" font-weight="600" fill="#161513">Tabla CAM segura</text>
  <rect x="92" y="378" width="112" height="44" rx="8" fill="#f5f4f2" stroke="#33553c" stroke-width="2"/>
  <text x="148" y="407" font-size="20" font-weight="600" fill="#33553c" text-anchor="middle">Static</text>
  <rect x="220" y="378" width="112" height="44" rx="8" fill="#f5f4f2" stroke="#33553c" stroke-width="2"/>
  <text x="276" y="407" font-size="20" font-weight="600" fill="#33553c" text-anchor="middle">Sticky</text>
  <rect x="348" y="378" width="112" height="44" rx="8" fill="#ffffff" stroke="#d63b25" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="404" y="407" font-size="20" font-weight="600" fill="#d63b25" text-anchor="middle">Dynamic</text>
  <text x="92" y="464" font-size="18" font-weight="600" fill="#d63b25">Dynamic solo existe aquí:</text>
  <text x="92" y="486" font-size="18" font-weight="500" fill="#47423e">nunca se escribe en la configuración</text>

  <!-- Flecha de guardado -->
  <text x="650" y="200" font-size="18" font-family="'JetBrains Mono', Consolas, monospace" fill="#161513" text-anchor="middle">copy running-config</text>
  <text x="650" y="224" font-size="18" font-family="'JetBrains Mono', Consolas, monospace" fill="#161513" text-anchor="middle">startup-config</text>
  <line x1="510" y1="250" x2="788" y2="250" stroke="#006b8f" stroke-width="3" marker-end="url(#aTeal)"/>
  <text x="650" y="282" font-size="18" font-weight="500" fill="#47423e" text-anchor="middle">o bien</text>
  <text x="650" y="306" font-size="18" font-family="'JetBrains Mono', Consolas, monospace" fill="#161513" text-anchor="middle">write memory</text>

  <!-- Flecha de arranque -->
  <text x="650" y="396" font-size="18" font-weight="500" fill="#47423e" text-anchor="middle">Al arrancar se carga</text>
  <line x1="788" y1="416" x2="510" y2="416" stroke="#47423e" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#aGrey)"/>
  <text x="650" y="446" font-size="18" font-weight="500" fill="#47423e" text-anchor="middle">en running-config</text>

  <!-- Chip NVRAM -->
  <g fill="#aea8a2">
    <rect x="836" y="104" width="14" height="14"/><rect x="886" y="104" width="14" height="14"/><rect x="936" y="104" width="14" height="14"/><rect x="986" y="104" width="14" height="14"/><rect x="1036" y="104" width="14" height="14"/><rect x="1086" y="104" width="14" height="14"/>
    <rect x="836" y="518" width="14" height="14"/><rect x="886" y="518" width="14" height="14"/><rect x="936" y="518" width="14" height="14"/><rect x="986" y="518" width="14" height="14"/><rect x="1036" y="518" width="14" height="14"/><rect x="1086" y="518" width="14" height="14"/>
  </g>
  <rect x="800" y="118" width="352" height="400" rx="8" fill="#f1efed" stroke="#312d2a" stroke-width="3"/>
  <text x="824" y="160" font-size="28" font-weight="800" fill="#161513">NVRAM</text>
  <text x="936" y="160" font-size="20" font-weight="500" fill="#47423e">(persistente)</text>
  <rect x="824" y="180" width="304" height="128" rx="8" fill="#ffffff" stroke="#d4cfca" stroke-width="2"/>
  <text x="844" y="212" font-size="20" font-family="'JetBrains Mono', Consolas, monospace" fill="#161513">startup-config</text>
  <rect x="844" y="236" width="112" height="44" rx="8" fill="#f5f4f2" stroke="#33553c" stroke-width="2"/>
  <text x="900" y="265" font-size="20" font-weight="600" fill="#33553c" text-anchor="middle">Static</text>
  <rect x="972" y="236" width="112" height="44" rx="8" fill="#f5f4f2" stroke="#33553c" stroke-width="2"/>
  <text x="1028" y="265" font-size="20" font-weight="600" fill="#33553c" text-anchor="middle">Sticky</text>
  <rect x="824" y="326" width="304" height="172" rx="8" fill="#ffffff" stroke="#d4cfca" stroke-width="2"/>
  <path d="M846 378 l8 9 l16 -18" fill="none" stroke="#33553c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="882" y="372" font-size="18" font-weight="600" fill="#33553c">Sobrevive al reinicio</text>
  <text x="882" y="396" font-size="18" font-weight="500" fill="#47423e">si se guardó antes</text>
  <path d="M848 436 l16 16 M864 436 l-16 16" fill="none" stroke="#d63b25" stroke-width="4" stroke-linecap="round"/>
  <text x="882" y="444" font-size="18" font-weight="600" fill="#d63b25">Dynamic nunca llega</text>
  <text x="882" y="468" font-size="18" font-weight="500" fill="#47423e">a la NVRAM</text>

  <!-- Reinicio -->
  <rect x="48" y="560" width="1104" height="76" rx="8" fill="#ffffff" stroke="#e4e1dd" stroke-width="2"/>
  <polygon points="96,568 72,604 90,604 80,630 116,590 98,590 110,568" fill="#d63b25"/>
  <text x="136" y="592" font-size="22" font-weight="800" fill="#d63b25">Reinicio o corte de energía</text>
  <text x="136" y="620" font-size="18" font-weight="500" fill="#161513">La RAM se borra: se pierden las MAC Dynamic y todo lo que no se guardó con write memory.</text>
</svg>
