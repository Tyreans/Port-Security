<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <title>Aislamiento en dos pasos para puertos no utilizados: shutdown y VLAN Blackhole 999</title>
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#006b8f"/>
    </marker>
    <marker id="arr-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d63b25"/>
    </marker>
    <marker id="arr-forest" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#33553c"/>
    </marker>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#312d2a"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#fbf9f8"/>
  <rect x="48" y="36" width="40" height="4" fill="#f0cc71"/>
  <text x="48" y="72" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="26" font-weight="800" fill="#161513">MITIGACIÓN EN DOS PASOS PARA PUERTOS NO UTILIZADOS</text>
  <text x="48" y="100" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="500" fill="#47423e">Combina apagado administrativo (shutdown) con una VLAN de aislamiento sin SVI ni enrutamiento</text>

  <rect x="350" y="135" width="500" height="58" rx="8" fill="#312d2a"/>
  <text x="600" y="170" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="800" fill="#ffffff">Interfaces sin usuario asignado (Fa0/11 - 24)</text>

  <line x1="480" y1="193" x2="300" y2="250" stroke="#312d2a" stroke-width="3" marker-end="url(#arr-ink)"/>
  <line x1="720" y1="193" x2="900" y2="250" stroke="#33553c" stroke-width="3" marker-end="url(#arr-forest)"/>

  <!-- Step 1 -->
  <rect x="64" y="260" width="500" height="340" rx="8" fill="#ffffff" stroke="#312d2a" stroke-width="2"/>
  <rect x="64" y="260" width="500" height="48" rx="8" fill="#312d2a"/>
  <text x="314" y="290" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="800" fill="#f0cc71">PASO 1 · BLOQUEO FÍSICO (SHUTDOWN)</text>
  <text x="96" y="346" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#161513">Estado: Administratively Down</text>
  <text x="96" y="382" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" fill="#161513">• Desenergiza la señalización del puerto físico</text>
  <text x="96" y="414" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" fill="#161513">• LED frontal apagado</text>
  <text x="96" y="446" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" fill="#161513">• Si alguien conecta un cable en la pared, no hay link-up</text>
  <rect x="96" y="485" width="436" height="80" rx="6" fill="#f5f4f2"/>
  <text x="116" y="518" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" fill="#006b8f">Switch(config-if-range)# shutdown</text>
  <text x="116" y="546" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#47423e">description PUERTO_NO_UTILIZADO_AISLADO</text>

  <!-- Step 2 -->
  <rect x="636" y="260" width="500" height="340" rx="8" fill="#ffffff" stroke="#33553c" stroke-width="2"/>
  <rect x="636" y="260" width="500" height="48" rx="8" fill="#33553c"/>
  <text x="886" y="290" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="800" fill="#ffffff">PASO 2 · CONTENCIÓN LÓGICA (VLAN 999)</text>
  <text x="668" y="346" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#33553c">VLAN_Blackhole_Aislamiento (Pozo sin salida)</text>
  <text x="668" y="382" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" fill="#161513">• Retira el puerto de la VLAN 1 predeterminada</text>
  <text x="668" y="414" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" fill="#161513">• Sin interfaz SVI (sin IP, sin gateway, sin DHCP)</text>
  <text x="668" y="446" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" fill="#161513">• Si se reactiva por error humano, no tiene salida a LAN</text>
  <rect x="668" y="485" width="436" height="80" rx="6" fill="#d6e5e5"/>
  <text x="688" y="518" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" fill="#161513">switchport mode access</text>
  <text x="688" y="546" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="700" fill="#33553c">switchport access vlan 999</text>

  <text x="1152" y="652" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#aea8a2">m4-vlan-blackhole.svg</text>
</svg>
