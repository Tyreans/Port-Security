<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <title>Procedimientos de recuperación de un puerto en err-disabled: Manual vs Automática</title>
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#006b8f"/>
    </marker>
    <marker id="arr-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d63b25"/>
    </marker>
    <marker id="arr-forest" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#33553c"/>
    </marker>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#312d2a"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#fbf9f8"/>
  <rect x="48" y="36" width="40" height="4" fill="#f0cc71"/>
  <text x="48" y="72" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="26" font-weight="800" fill="#161513">RECUPERACIÓN DE PUERTOS EN ESTADO ERR-DISABLED</text>
  <text x="48" y="100" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="500" fill="#47423e">Intervención administrativa (shutdown / no shutdown) frente a recuperación temporizada (errdisable recovery)</text>

  <!-- Top root box -->
  <rect x="380" y="135" width="440" height="58" rx="8" fill="#312d2a"/>
  <text x="600" y="170" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="800" fill="#f0cc71">Puerto Gi0/1 en estado err-disabled</text>

  <line x1="490" y1="193" x2="300" y2="245" stroke="#312d2a" stroke-width="3" marker-end="url(#arr-ink)"/>
  <line x1="710" y1="193" x2="900" y2="245" stroke="#006b8f" stroke-width="3" marker-end="url(#arr-teal)"/>

  <!-- Left: Manual Recovery -->
  <rect x="64" y="255" width="500" height="355" rx="8" fill="#ffffff" stroke="#312d2a" stroke-width="2"/>
  <rect x="64" y="255" width="500" height="48" rx="8" fill="#312d2a"/>
  <text x="314" y="285" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="800" fill="#ffffff">1. RECUPERACIÓN MANUAL (ADMINISTRATIVA)</text>

  <text x="92" y="336" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" fill="#161513">1. Identificar la MAC infractora y desconectar al intruso.</text>
  <text x="92" y="366" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" fill="#161513">2. Reiniciar la máquina de estados del puerto en CLI:</text>
  <rect x="92" y="384" width="444" height="110" rx="6" fill="#f5f4f2" stroke="#e4e1dd"/>
  <text x="112" y="414" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" fill="#006b8f">Switch(config)# interface gi0/1</text>
  <text x="112" y="442" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="600" fill="#161513">Switch(config-if)# shutdown</text>
  <text x="112" y="470" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="600" fill="#33553c">Switch(config-if)# no shutdown</text>

  <rect x="92" y="514" width="444" height="72" rx="6" fill="#d6e5e5"/>
  <text x="314" y="544" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#161513">Ideal para: Bancos, servidores críticos y auditorías SOC</text>
  <text x="314" y="568" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#161513">Solo usar «no shutdown» no limpia la bandera de fallo.</text>

  <!-- Right: Auto Recovery -->
  <rect x="636" y="255" width="500" height="355" rx="8" fill="#ffffff" stroke="#006b8f" stroke-width="2"/>
  <rect x="636" y="255" width="500" height="48" rx="8" fill="#006b8f"/>
  <text x="886" y="285" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="800" fill="#ffffff">2. RECUPERACIÓN AUTOMÁTICA (TEMPORIZADA)</text>

  <text x="664" y="336" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" fill="#161513">1. Habilitar auto-recuperación para Port Security:</text>
  <text x="664" y="366" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" fill="#161513">2. Definir intervalo (30 a 86,400 s · 300 s por defecto):</text>
  <rect x="664" y="384" width="444" height="110" rx="6" fill="#f5f4f2" stroke="#e4e1dd"/>
  <text x="680" y="422" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="600" fill="#161513">errdisable recovery cause psecure-violation</text>
  <text x="680" y="456" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="600" fill="#006b8f">errdisable recovery interval 300</text>

  <rect x="664" y="514" width="444" height="72" rx="6" fill="#f1efed" stroke="#d63b25"/>
  <text x="886" y="542" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#d63b25">Advertencia: Riesgo de Port Flapping cíclico</text>
  <text x="886" y="566" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#161513">Si el atacante sigue conectado, el puerto caerá cada 300 s.</text>

  <text x="1152" y="652" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#aea8a2">m3-recuperacion-manual-vs-auto.svg</text>
</svg>
