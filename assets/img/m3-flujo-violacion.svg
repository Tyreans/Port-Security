<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <title>Diagrama de flujo de evaluación y violación de Port Security</title>
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#006b8f"/>
    </marker>
    <marker id="arr-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d63b25"/>
    </marker>
    <marker id="arr-forest" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#33553c"/>
    </marker>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#312d2a"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#fbf9f8"/>
  <rect x="48" y="36" width="40" height="4" fill="#f0cc71"/>
  <text x="48" y="72" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="26" font-weight="800" fill="#161513">ALGORITMO DE EVALUACIÓN DE TRAMAS EN PORT SECURITY</text>
  <text x="48" y="100" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="500" fill="#47423e">Cómo decide el switch si reenvía, aprende o dispara uno de los tres modos de violación</text>

  <!-- Entry -->
  <rect x="64" y="210" width="210" height="90" rx="8" fill="#312d2a"/>
  <text x="169" y="250" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Ingresa trama</text>
  <text x="169" y="276" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#f0cc71">Inspecciona SMAC</text>

  <line x1="274" y1="255" x2="340" y2="255" stroke="#312d2a" stroke-width="3" marker-end="url(#arr-ink)"/>

  <!-- Check 1: In secure table? -->
  <rect x="350" y="195" width="240" height="120" rx="8" fill="#ffffff" stroke="#006b8f" stroke-width="2"/>
  <text x="470" y="242" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#161513">¿SMAC ya está en la</text>
  <text x="470" y="268" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#161513">tabla segura del puerto?</text>

  <!-- Yes -> Forward -->
  <line x1="470" y1="195" x2="470" y2="140" stroke="#33553c" stroke-width="3" marker-end="url(#arr-forest)"/>
  <text x="486" y="175" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#33553c">SÍ</text>
  <rect x="350" y="115" width="240" height="44" rx="6" fill="#33553c"/>
  <text x="470" y="143" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Reenvío normal permitido</text>

  <!-- No -> Check 2: Reached maximum? -->
  <line x1="470" y1="315" x2="470" y2="385" stroke="#312d2a" stroke-width="3" marker-end="url(#arr-ink)"/>
  <text x="486" y="356" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#d63b25">NO</text>

  <rect x="350" y="395" width="240" height="120" rx="8" fill="#ffffff" stroke="#006b8f" stroke-width="2"/>
  <text x="470" y="442" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#161513">¿Se alcanzó el límite</text>
  <text x="470" y="468" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="600" fill="#006b8f">maximum &lt;n&gt;?</text>

  <!-- No -> Learn MAC -->
  <line x1="350" y1="455" x2="274" y2="455" stroke="#33553c" stroke-width="3" marker-end="url(#arr-forest)"/>
  <text x="302" y="442" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#33553c">NO</text>
  <rect x="64" y="410" width="200" height="90" rx="8" fill="#d6e5e5" stroke="#33553c" stroke-width="2"/>
  <text x="164" y="448" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="800" fill="#33553c">Aprende la MAC</text>
  <text x="164" y="474" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#161513">y reenvía la trama</text>

  <!-- Yes -> Violation -->
  <line x1="590" y1="455" x2="680" y2="455" stroke="#d63b25" stroke-width="3" marker-end="url(#arr-danger)"/>
  <text x="625" y="442" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="800" fill="#d63b25">SÍ (o MAC Move)</text>

  <!-- 3 Violation Branches -->
  <rect x="692" y="140" width="444" height="460" rx="8" fill="#f1efed" stroke="#d63b25" stroke-width="2"/>
  <rect x="692" y="140" width="444" height="46" rx="8" fill="#d63b25"/>
  <text x="914" y="169" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="800" fill="#ffffff">VIOLACIÓN DE SEGURIDAD DETECTADA</text>

  <rect x="720" y="210" width="388" height="105" rx="6" fill="#ffffff" stroke="#e4e1dd"/>
  <text x="744" y="242" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="800" fill="#161513">Modo Protect</text>
  <text x="744" y="268" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#47423e">Descarta la trama intrusa. Puerto sigue Up/Up.</text>
  <text x="744" y="292" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#d63b25">Sin Syslog, sin SNMP y sin subir contador.</text>

  <rect x="720" y="332" width="388" height="105" rx="6" fill="#ffffff" stroke="#006b8f" stroke-width="2"/>
  <text x="744" y="364" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="800" fill="#006b8f">Modo Restrict</text>
  <text x="744" y="390" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#161513">Descarta la trama intrusa. Puerto sigue Up/Up.</text>
  <text x="744" y="414" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#33553c">Envía Syslog + SNMP Trap + sube Violation Count.</text>

  <rect x="720" y="454" width="388" height="120" rx="6" fill="#312d2a"/>
  <text x="744" y="486" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="800" fill="#f0cc71">Modo Shutdown (Por defecto)</text>
  <text x="744" y="512" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#ffffff">Coloca el puerto en estado err-disabled (Down/Down).</text>
  <text x="744" y="536" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#ffffff">Syslog crítico + SNMP + LED ámbar / apagado.</text>
  <text x="744" y="558" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#f0cc71">Bloquea todo el tráfico hasta recuperar la interfaz.</text>

  <text x="1152" y="652" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#aea8a2">m3-flujo-violacion.svg</text>
</svg>
