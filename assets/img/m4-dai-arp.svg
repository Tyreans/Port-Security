<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <title>Dynamic ARP Inspection (DAI) validando paquetes ARP contra la tabla de DHCP Snooping</title>
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#006b8f"/>
    </marker>
    <marker id="arr-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d63b25"/>
    </marker>
    <marker id="arr-forest" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#33553c"/>
    </marker>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#312d2a"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#fbf9f8"/>
  <rect x="48" y="36" width="40" height="4" fill="#f0cc71"/>
  <text x="48" y="72" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="26" font-weight="800" fill="#161513">DYNAMIC ARP INSPECTION (DAI) CONTRA ARP POISONING</text>
  <text x="48" y="100" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="500" fill="#47423e">Intercepta respuestas ARP en puertos Untrusted y verifica la tupla {IP, MAC} antes de reenviarlas</text>

  <!-- Attacker sending poisoned ARP -->
  <rect x="64" y="165" width="320" height="190" rx="8" fill="#ffffff" stroke="#d63b25" stroke-width="2"/>
  <rect x="64" y="165" width="320" height="42" rx="8" fill="#d63b25"/>
  <text x="224" y="192" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">ATACANTE EN PUERTO Gi0/7</text>
  <text x="224" y="236" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#d63b25">Envía Gratuitous ARP falso:</text>
  <text x="224" y="268" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#161513">«Gateway 10.0.10.1 está en</text>
  <text x="224" y="292" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="600" fill="#d63b25">MAC 00:DE:AD:BE:EF:99»</text>
  <text x="224" y="330" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#47423e">(Intento de Man-in-the-Middle)</text>

  <!-- Legit user sending valid ARP -->
  <rect x="64" y="395" width="320" height="175" rx="8" fill="#ffffff" stroke="#33553c" stroke-width="2"/>
  <rect x="64" y="395" width="320" height="42" rx="8" fill="#33553c"/>
  <text x="224" y="422" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">USUARIO LEGÍTIMO EN Gi0/1</text>
  <text x="224" y="468" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#33553c">Paquete ARP válido:</text>
  <text x="224" y="500" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#161513">IP: 10.0.10.25</text>
  <text x="224" y="524" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#33553c">MAC: 00:50:56:BE:A1:B2</text>

  <line x1="384" y1="260" x2="520" y2="260" stroke="#d63b25" stroke-width="4" marker-end="url(#arr-danger)"/>
  <line x1="384" y1="485" x2="520" y2="485" stroke="#33553c" stroke-width="4" marker-end="url(#arr-forest)"/>

  <!-- Switch with DAI -->
  <rect x="532" y="165" width="604" height="405" rx="8" fill="#ffffff" stroke="#312d2a" stroke-width="2"/>
  <rect x="532" y="165" width="604" height="48" rx="8" fill="#312d2a"/>
  <text x="834" y="195" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="800" fill="#ffffff">MOTOR DYNAMIC ARP INSPECTION (DAI)</text>

  <!-- Rejected box -->
  <rect x="564" y="235" width="540" height="82" rx="6" fill="#f5f4f2" stroke="#d63b25" stroke-width="2"/>
  <text x="588" y="268" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#d63b25">✗ Paquete de Gi0/7 NO coincide con la Binding Table</text>
  <text x="588" y="296" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#161513">El switch descarta la trama ARP maliciosa y registra la alerta.</text>

  <!-- Binding table reference -->
  <rect x="564" y="336" width="540" height="90" rx="6" fill="#d6e5e5" stroke="#006b8f"/>
  <text x="834" y="366" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="800" fill="#161513">Consulta en DHCP Snooping Binding Database</text>
  <text x="834" y="396" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#006b8f">Gi0/1 → 10.0.10.25 = 00:50:56:BE:A1:B2 (Única relación autorizada)</text>

  <!-- Approved box -->
  <rect x="564" y="446" width="540" height="92" rx="6" fill="#f5f4f2" stroke="#33553c" stroke-width="2"/>
  <text x="588" y="480" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="800" fill="#33553c">✓ Paquete de Gi0/1 coincide con la Binding Table</text>
  <text x="588" y="508" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#161513">Se permite el reenvío ARP. Los clientes conservan la MAC real del Gateway.</text>

  <text x="1152" y="652" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#aea8a2">m4-dai-arp.svg</text>
</svg>
