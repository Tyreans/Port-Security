<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <title>Módulo 2: Mecanismos de aprendizaje MAC</title>
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#006b8f"/>
    </marker>
    <marker id="arr-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d63b25"/>
    </marker>
    <marker id="arr-forest" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#33553c"/>
    </marker>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#312d2a"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#fbf9f8"/>
  <rect x="48" y="36" width="40" height="4" fill="#f0cc71"/>
  <text x="48" y="72" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="26" font-weight="800" fill="#161513">MÓDULO 2 · APRENDIZAJE Y VALIDACIÓN MAC</text>
  <text x="48" y="100" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="500" fill="#47423e">Static, Dynamic y Sticky en la Secure MAC Address Table</text>

  <!-- 3 input chips -->
  <rect x="72" y="165" width="320" height="110" rx="8" fill="#ffffff" stroke="#312d2a" stroke-width="2"/>
  <text x="96" y="200" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="800" fill="#161513">1. Estática (Static)</text>
  <text x="96" y="226" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#006b8f">mac-address 0011.2233.4455</text>
  <text x="96" y="252" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#33553c" font-weight="600">✓ running-config · Persiste en NVRAM</text>

  <rect x="72" y="300" width="320" height="110" rx="8" fill="#ffffff" stroke="#006b8f" stroke-width="2"/>
  <text x="96" y="335" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="800" fill="#161513">2. Dinámica (Dynamic)</text>
  <text x="96" y="361" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#006b8f">switchport port-security</text>
  <text x="96" y="387" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#d63b25" font-weight="600">✗ Solo RAM (CAM) · Volátil en link-down</text>

  <rect x="72" y="435" width="320" height="110" rx="8" fill="#ffffff" stroke="#33553c" stroke-width="2"/>
  <text x="96" y="470" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="800" fill="#161513">3. Persistente (Sticky)</text>
  <text x="96" y="496" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#006b8f">mac-address sticky</text>
  <text x="96" y="522" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#33553c" font-weight="600">✓ Auto-escribe en CLI · Estándar corporativo</text>

  <line x1="402" y1="220" x2="548" y2="290" stroke="#312d2a" stroke-width="3" marker-end="url(#arr-ink)"/>
  <line x1="402" y1="355" x2="548" y2="355" stroke="#006b8f" stroke-width="3" marker-end="url(#arr-teal)"/>
  <line x1="402" y1="490" x2="548" y2="420" stroke="#33553c" stroke-width="3" marker-end="url(#arr-forest)"/>

  <!-- Secure MAC Table -->
  <rect x="560" y="165" width="568" height="380" rx="8" fill="#ffffff" stroke="#e4e1dd" stroke-width="2"/>
  <rect x="560" y="165" width="568" height="52" rx="8" fill="#312d2a"/>
  <text x="844" y="198" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff">SECURE MAC ADDRESS TABLE (CUOTA Y AGING)</text>

  <rect x="592" y="242" width="504" height="38" fill="#f5f4f2"/>
  <text x="610" y="266" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="600" fill="#161513">VLAN   MAC Address       Type            Port   Age</text>

  <text x="610" y="310" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" fill="#161513">10     0011.2233.4455    SecureStatic    Gi0/1   -</text>
  <line x1="592" y1="325" x2="1096" y2="325" stroke="#e4e1dd"/>
  <text x="610" y="355" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" fill="#161513">10     0050.56be.a1b2    SecureSticky    Gi0/2   -</text>
  <line x1="592" y1="370" x2="1096" y2="370" stroke="#e4e1dd"/>
  <text x="610" y="400" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" fill="#161513">10     0014.2201.2345    SecureDynamic   Gi0/3  18 (I)</text>

  <rect x="592" y="435" width="240" height="80" rx="6" fill="#f1efed"/>
  <text x="712" y="466" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="800" fill="#161513">Cuota: maximum &lt;1-4097&gt;</text>
  <text x="712" y="492" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#47423e">Por defecto = 1 (VoIP + PC = 2)</text>

  <rect x="856" y="435" width="240" height="80" rx="6" fill="#d6e5e5"/>
  <text x="976" y="466" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="800" fill="#161513">Aging: Absolute / Inactivity</text>
  <text x="976" y="492" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" fill="#161513">Solo aplica a SecureDynamic</text>

  <text x="1152" y="652" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#aea8a2">card-m2.svg</text>
</svg>
