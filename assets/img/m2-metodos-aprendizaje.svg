<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <title>Comparación de los tres métodos de aprendizaje de direcciones MAC seguras: Static, Dynamic y Sticky</title>
  <rect width="1200" height="675" fill="#fbf9f8"/>
  <text x="48" y="72" font-size="32" font-weight="800" fill="#161513">Métodos de aprendizaje de MAC seguras</text>

  <!-- Columna Static -->
  <g transform="translate(48,0)">
    <rect x="0" y="104" width="352" height="523" rx="8" fill="#ffffff" stroke="#e4e1dd" stroke-width="2"/>
    <rect x="0" y="104" width="352" height="72" rx="8" fill="#312d2a"/>
    <rect x="0" y="160" width="352" height="16" fill="#312d2a"/>
    <text x="24" y="140" font-size="28" font-weight="800" fill="#ffffff">Static</text>
    <text x="24" y="164" font-size="18" font-weight="500" fill="#aea8a2">Estática</text>
    <text x="24" y="206" font-size="18" font-weight="600" fill="#47423e">Cómo entra la MAC</text>
    <text x="24" y="234" font-size="20" font-weight="500" fill="#161513">Manual por CLI</text>
    <text x="24" y="258" font-size="20" font-weight="500" fill="#161513">(la escribe el admin)</text>
    <line x1="24" y1="278" x2="328" y2="278" stroke="#e4e1dd" stroke-width="2"/>
    <text x="24" y="306" font-size="18" font-weight="600" fill="#47423e">Dónde vive</text>
    <text x="24" y="334" font-size="20" font-weight="500" fill="#161513">running-config</text>
    <text x="24" y="358" font-size="20" font-weight="500" fill="#161513">+ tabla CAM segura</text>
    <line x1="24" y1="378" x2="328" y2="378" stroke="#e4e1dd" stroke-width="2"/>
    <text x="24" y="406" font-size="18" font-weight="600" fill="#47423e">¿Persiste tras reinicio?</text>
    <path d="M24 432 l8 9 l16 -18" fill="none" stroke="#33553c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="442" font-size="20" font-weight="600" fill="#33553c">Sí, tras write memory</text>
    <line x1="24" y1="466" x2="328" y2="466" stroke="#e4e1dd" stroke-width="2"/>
    <text x="24" y="494" font-size="18" font-weight="600" fill="#47423e">¿Sobrevive link-down?</text>
    <path d="M24 520 l8 9 l16 -18" fill="none" stroke="#33553c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="530" font-size="20" font-weight="600" fill="#33553c">Sí</text>
    <rect x="24" y="560" width="304" height="44" rx="8" fill="#f5f4f2"/>
    <text x="40" y="588" font-size="18" font-family="'JetBrains Mono', Consolas, monospace" fill="#161513">mac-address 0050.7966.6801</text>
  </g>

  <!-- Columna Dynamic -->
  <g transform="translate(424,0)">
    <rect x="0" y="104" width="352" height="523" rx="8" fill="#ffffff" stroke="#e4e1dd" stroke-width="2"/>
    <rect x="0" y="104" width="352" height="72" rx="8" fill="#312d2a"/>
    <rect x="0" y="160" width="352" height="16" fill="#312d2a"/>
    <text x="24" y="140" font-size="28" font-weight="800" fill="#ffffff">Dynamic</text>
    <text x="24" y="164" font-size="18" font-weight="500" fill="#aea8a2">Dinámica (por defecto)</text>
    <text x="24" y="206" font-size="18" font-weight="600" fill="#47423e">Cómo entra la MAC</text>
    <text x="24" y="234" font-size="20" font-weight="500" fill="#161513">Pasiva: se aprende de la</text>
    <text x="24" y="258" font-size="20" font-weight="500" fill="#161513">primera trama recibida</text>
    <line x1="24" y1="278" x2="328" y2="278" stroke="#e4e1dd" stroke-width="2"/>
    <text x="24" y="306" font-size="18" font-weight="600" fill="#47423e">Dónde vive</text>
    <text x="24" y="334" font-size="20" font-weight="500" fill="#161513">Solo tabla CAM segura</text>
    <text x="24" y="358" font-size="20" font-weight="500" fill="#161513">(RAM volátil)</text>
    <line x1="24" y1="378" x2="328" y2="378" stroke="#e4e1dd" stroke-width="2"/>
    <text x="24" y="406" font-size="18" font-weight="600" fill="#47423e">¿Persiste tras reinicio?</text>
    <path d="M26 424 l16 16 M42 424 l-16 16" fill="none" stroke="#d63b25" stroke-width="4" stroke-linecap="round"/>
    <text x="56" y="442" font-size="20" font-weight="600" fill="#d63b25">No</text>
    <line x1="24" y1="466" x2="328" y2="466" stroke="#e4e1dd" stroke-width="2"/>
    <text x="24" y="494" font-size="18" font-weight="600" fill="#47423e">¿Sobrevive link-down?</text>
    <path d="M26 512 l16 16 M42 512 l-16 16" fill="none" stroke="#d63b25" stroke-width="4" stroke-linecap="round"/>
    <text x="56" y="530" font-size="20" font-weight="600" fill="#d63b25">No</text>
    <rect x="24" y="560" width="304" height="44" rx="8" fill="#f5f4f2"/>
    <text x="40" y="588" font-size="18" font-family="'JetBrains Mono', Consolas, monospace" fill="#161513">switchport port-security</text>
  </g>

  <!-- Columna Sticky -->
  <g transform="translate(800,0)">
    <rect x="0" y="104" width="352" height="523" rx="8" fill="#ffffff" stroke="#e4e1dd" stroke-width="2"/>
    <rect x="0" y="104" width="352" height="72" rx="8" fill="#312d2a"/>
    <rect x="0" y="160" width="352" height="16" fill="#312d2a"/>
    <text x="24" y="140" font-size="28" font-weight="800" fill="#ffffff">Sticky</text>
    <text x="24" y="164" font-size="18" font-weight="500" fill="#aea8a2">Persistente</text>
    <rect x="196" y="120" width="132" height="32" rx="8" fill="#f0cc71"/>
    <text x="262" y="142" font-size="18" font-weight="600" fill="#161513" text-anchor="middle">Recomendada</text>
    <text x="24" y="206" font-size="18" font-weight="600" fill="#47423e">Cómo entra la MAC</text>
    <text x="24" y="234" font-size="20" font-weight="500" fill="#161513">Dinámica + auto-escrita</text>
    <text x="24" y="258" font-size="20" font-weight="500" fill="#161513">en running-config</text>
    <line x1="24" y1="278" x2="328" y2="278" stroke="#e4e1dd" stroke-width="2"/>
    <text x="24" y="306" font-size="18" font-weight="600" fill="#47423e">Dónde vive</text>
    <text x="24" y="334" font-size="20" font-weight="500" fill="#161513">running-config</text>
    <text x="24" y="358" font-size="20" font-weight="500" fill="#161513">+ tabla CAM segura</text>
    <line x1="24" y1="378" x2="328" y2="378" stroke="#e4e1dd" stroke-width="2"/>
    <text x="24" y="406" font-size="18" font-weight="600" fill="#47423e">¿Persiste tras reinicio?</text>
    <path d="M24 432 l8 9 l16 -18" fill="none" stroke="#33553c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="442" font-size="20" font-weight="600" fill="#33553c">Sí, tras write memory</text>
    <line x1="24" y1="466" x2="328" y2="466" stroke="#e4e1dd" stroke-width="2"/>
    <text x="24" y="494" font-size="18" font-weight="600" fill="#47423e">¿Sobrevive link-down?</text>
    <path d="M24 520 l8 9 l16 -18" fill="none" stroke="#33553c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="530" font-size="20" font-weight="600" fill="#33553c">Sí</text>
    <rect x="24" y="560" width="304" height="44" rx="8" fill="#f5f4f2"/>
    <text x="40" y="588" font-size="18" font-family="'JetBrains Mono', Consolas, monospace" fill="#161513">mac-address sticky</text>
  </g>
</svg>
